<style>
  #cookie-banner {
    position: fixed !important;
    z-index: 2147483647 !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    background-color: #212529 !important;
    color: #f8f9fa !important;
    padding: 20px !important;
    box-shadow: 0 -2px 15px rgba(0,0,0,0.5) !important;
    display: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    box-sizing: border-box !important;
  }
  .cb-container {
    max-width: 1000px !important;
    margin: 0 auto !important;
    display: block !important;
    text-align: center !important;
  }
  .cb-text {
    margin: 0 0 15px 0 !important;
    font-size: 14px !important;
    line-height: 1.5 !important;
  }
  .cb-buttons {
    display: flex !important;
    justify-content: center !important;
    gap: 10px !important;
  }
  .cb-btn {
    padding: 8px 20px !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    font-weight: 600 !important;
    font-size: 13px !important;
    border: none !important;
    transition: 0.2s !important;
  }
  #accept-cookies { background-color: #007bff !important; color: white !important; }
  #accept-cookies:hover { background-color: #0056b3 !important; }
  #decline-cookies { background-color: transparent !important; color: #adb5bd !important; border: 1px solid #495057 !important; }
  #decline-cookies:hover { background-color: #343a40 !important; color: white !important; }
</style>

<div id="cookie-banner">
  <div class="cb-container">
    <p class="cb-text">
      {{ if eq .Site.Language.Lang "de" }}
        Wir nutzen Cookies zur Analyse unserer Website. Details finden Sie in der <a href="{{ "privacy" | relLangURL }}" style="color: #007bff !important; text-decoration: underline !important;">Datenschutzerklärung</a>.
      {{ else }}
        We use cookies to analyze our website traffic. Details in our <a href="{{ "privacy" | relLangURL }}" style="color: #007bff !important; text-decoration: underline !important;">Privacy Policy</a>.
      {{ end }}
    </p>
    <div class="cb-buttons">
      <button id="accept-cookies" class="cb-btn">{{ if eq .Site.Language.Lang "de" }}Akzeptieren{{ else }}Accept{{ end }}</button>
      <button id="decline-cookies" class="cb-btn">{{ if eq .Site.Language.Lang "de" }}Ablehnen{{ else }}Decline{{ end }}</button>
    </div>
  </div>
</div>

<script>
  (function() {
    var banner = document.getElementById('cookie-banner');
    var acceptBtn = document.getElementById('accept-cookies');
    var declineBtn = document.getElementById('decline-cookies');
    var consent = localStorage.getItem('cookie-consent');

    if (!consent) {
      banner.style.display = 'block';
    }

    acceptBtn.onclick = function() {
      localStorage.setItem('cookie-consent', 'accepted');
      banner.style.display = 'none';
      location.reload();
    };

    declineBtn.onclick = function() {
      localStorage.setItem('cookie-consent', 'declined');
      banner.style.display = 'none';
    };
  })();
</script>
